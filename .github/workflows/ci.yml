name: Test public Bulwark source

on:
  push:
    branches: [main, 'source/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint the source
        run: npm run lint
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run tests with browser coverage
        run: COMAIL_BROWSER_TESTS=1 npm test
      - name: Build the application
        run: npx next build --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
