name: Test public Bulwark source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: comail-big-nix-isolated
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Install the Nix Chromium build
        run: |
          browser=$(nix build --no-link --print-out-paths \
            github:NixOS/nixpkgs/753cc8a3a87467296ddd1fa93f0cc3e81120ee46#chromium)
          test -x "$browser/bin/chromium"
          printf 'COMAIL_CHROMIUM_PATH=%s/bin/chromium\n' "$browser" >> "$GITHUB_ENV"
      - run: COMAIL_BROWSER_TESTS=1 npm test
      - run: npx next build --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
